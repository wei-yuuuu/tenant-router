name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm

      - name: Install core dependencies
        run: npm ci

      - name: Install control panel dependencies
        run: npm ci --prefix apps/control-panel

      - name: Typecheck core
        run: npm run typecheck

      - name: Run core tests
        run: npm test

      - name: Check Node syntax
        run: npm run check

      - name: Build control panel
        run: npm run build --prefix apps/control-panel
